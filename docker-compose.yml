services:
  db:
    image: postgres:17-alpine
    container_name: ordersync-db
    environment:
      POSTGRES_USER: ordersync
      POSTGRES_PASSWORD: ordersync
      POSTGRES_DB: ordersync
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ordersync -d ordersync']
      interval: 5s
      timeout: 5s
      retries: 5

  db_test:
    image: postgres:17-alpine
    container_name: ordersync-db-test
    environment:
      POSTGRES_USER: ordersync
      POSTGRES_PASSWORD: ordersync
      POSTGRES_DB: ordersync_test
    ports:
      - '5434:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ordersync -d ordersync_test']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
